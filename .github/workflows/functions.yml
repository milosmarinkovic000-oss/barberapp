name: Functions

# Na svaki push (svaka grana) i pull request.
on:
  push:
    paths:
      - "functions/**"
      - "seed/**"
      - "scripts/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/functions.yml"
  pull_request:
    paths:
      - "functions/**"
      - "seed/**"
      - "scripts/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and tests on the Firebase emulators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Firestore emulator traži Javu 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests (availability, concurrent holds, rules, integrations) on emulators
        run: npm test
