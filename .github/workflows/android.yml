name: Android

# Na svaki push (svaka grana) i pull request. Snimci za sajt zavise i od seed fotografija.
on:
  push:
    paths: ["android/**", "hosting/public/screens/**", "seed/images/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "hosting/public/screens/**", "seed/images/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, unit and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint (warnings are errors)
        run: ./gradlew :app:lintDebug

      - name: Unit, UI and screenshot tests (Roborazzi verify)
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Release build (R8) and benchmark module
        run: ./gradlew :app:assembleRelease :baselineprofile:assembleBenchmarkRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
            android/app/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: termin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
