<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Termin</title>
  <meta name="description" content="Termin — zakazivanje termina u frizerskim salonima u Srbiji.">
  <style>
    :root { --bg: #FAF8F5; --text: #1C1B1A; --muted: #6E6A64; --accent: #8C6A3F; --on-accent: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121110; --text: #F2EEE8; --muted: #B5AFA6; --accent: #D4B47A; --on-accent: #1C1B1A; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; text-align: center; }
    h1 { font: 600 40px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { display: inline-block; padding: 14px 24px; border-radius: 12px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <h1>Termin</h1>
    <p>Pronađi frizerski salon i zakaži termin za par dodira.</p>
    <a href="https://play.google.com/store/apps/details?id=rs.termin.app">Preuzmi sa Google Play</a>
  </div>
</body>
</html>
